spring.application.name=renewiq
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Optional SMTP availability must not block the core app's Docker readiness.
management.health.mail.enabled=false
server.port=8081
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/renewiq_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=200KB
spring.servlet.multipart.max-request-size=220KB

# AI assistant: Groq free tier by default; any tool-capable OpenAI-compatible API can be configured.
# Never reuse an OpenRouter key against a different provider.
ai.api-key=${AI_API_KEY:${GROQ_API_KEY:}}
ai.model=${AI_MODEL:openai/gpt-oss-20b}
ai.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1}

# Renewal emails are opt-in until SMTP credentials and a verified sender are configured.
renewiq.reminders.email-enabled=${REMINDER_EMAIL_ENABLED:false}
renewiq.reminders.from=${REMINDER_FROM:}
renewiq.reminders.zone=${REMINDER_TIMEZONE:Asia/Kolkata}
renewiq.reminders.cron=${REMINDER_CRON:0 0 9 * * *}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
