<figure class="chart-card">
  <figcaption>
    <div><span class="eyebrow">ACCOUNT INSIGHTS · INR</span><h3>{{ chart.title }}</h3><span class="as-of">Snapshot: {{ chart.asOf }}</span></div>
    <button type="button" class="btn-ghost" [disabled]="!points.length" (click)="exportCsv()" aria-label="Download chart data as CSV">↓ CSV</button>
  </figcaption>
  @if (points.length) {
    <div class="stat"><strong>{{ money(total) }}</strong><span>{{ totalLabel }}</span></div>
    <div class="plot-scroll" tabindex="0" aria-label="Scrollable chart. Tab to data points for exact values.">
      <svg [attr.viewBox]="'0 0 720 ' + height" role="img" [attr.aria-label]="chart.title + '. ' + chart.xLabel + '; ' + chart.yLabel">
        @if (chart.type === 'bar') {
          @for (tickValue of ticks; track $index) {
            <line class="grid" [attr.x1]="plotLeft + barWidth(tickValue)" y1="20" [attr.x2]="plotLeft + barWidth(tickValue)" [attr.y2]="plotBottom" />
            <text class="axis-label" text-anchor="middle" [attr.x]="plotLeft + barWidth(tickValue)" [attr.y]="plotBottom + 24">{{ tick(tickValue) }}</text>
          }
          @for (point of points; track $index; let i = $index) {
            <text class="category-label" text-anchor="end" x="172" [attr.y]="barY(i) + barHeight() / 2 + 5">{{ label(point.label) }}</text>
            <rect class="bar" [class.selected]="selected() === i" [attr.x]="plotLeft" [attr.y]="barY(i)" [attr.width]="barWidth(point.value)" [attr.height]="barHeight()" rx="4"
              tabindex="0" role="img" [attr.aria-label]="point.label + ': ' + money(point.value)" (mouseenter)="selected.set(i)" (focus)="selected.set(i)" (click)="selected.set(i)">
              <title>{{ point.label }}: {{ money(point.value) }}</title>
            </rect>
          }
          <line class="axis" [attr.x1]="plotLeft" y1="20" [attr.x2]="plotLeft" [attr.y2]="plotBottom" />
          <text class="axis-title" x="440" [attr.y]="height - 10" text-anchor="middle">{{ chart.xLabel }}</text>
          <text class="axis-title" x="10" y="13">{{ chart.yLabel }}</text>
        } @else {
          @for (tickValue of ticks; track $index) {
            <line class="grid" [attr.x1]="plotLeft" [attr.y1]="y(tickValue)" x2="700" [attr.y2]="y(tickValue)" />
            <text class="axis-label" text-anchor="end" x="73" [attr.y]="y(tickValue) + 5">{{ tick(tickValue) }}</text>
          }
          <line class="axis" [attr.x1]="plotLeft" y1="30" [attr.x2]="plotLeft" [attr.y2]="plotBottom" />
          <path class="series" [attr.d]="path" />
          @for (point of points; track $index; let i = $index) {
            <circle class="point" [class.selected]="selected() === i" [attr.cx]="x(i)" [attr.cy]="y(point.value)" r="5" tabindex="0" role="img"
              [attr.aria-label]="point.label + ': ' + money(point.value)" (mouseenter)="selected.set(i)" (focus)="selected.set(i)" (click)="selected.set(i)"><title>{{ point.label }}: {{ money(point.value) }}</title></circle>
            @if (points.length <= 7 || i % 2 === 0 || i === points.length - 1) { <text class="axis-label" text-anchor="middle" [attr.x]="x(i)" [attr.y]="plotBottom + 24">{{ label(point.label) }}</text> }
          }
          <text class="axis-title" x="392" [attr.y]="height - 10" text-anchor="middle">{{ chart.xLabel }}</text>
          <text class="axis-title" x="10" y="14">{{ chart.yLabel }}</text>
        }
        <line class="axis" [attr.x1]="plotLeft" [attr.y1]="plotBottom" x2="700" [attr.y2]="plotBottom" />
      </svg>
    </div>
    <div class="readout" aria-live="polite">@if (activePoint; as point) { <span>{{ point.label }}</span><strong>{{ money(point.value) }}</strong> } @else { <span>Hover, tap, or focus a point to inspect its value.</span> }</div>
    <details class="data-table"><summary>View exact values</summary><div class="table-scroll"><table><thead><tr><th>{{ chart.type === 'bar' ? chart.yLabel : chart.xLabel }}</th><th>Amount (INR)</th></tr></thead><tbody>@for (point of points; track $index) { <tr><td>{{ point.label }}</td><td>{{ money(point.value) }}</td></tr> }</tbody></table></div></details>
  } @else { <p class="empty-chart">No matching active subscriptions to plot. Add a subscription or choose a different category.</p> }
  <p class="method">{{ chart.note }}</p>
</figure>
